<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182337"/>
      <stop offset="100%" stop-color="#0E1624"/>
    </linearGradient>
    <linearGradient id="fbAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F86BC"/>
      <stop offset="100%" stop-color="#94A8D0"/>
    </linearGradient>
    <linearGradient id="editorialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3E5D"/>
      <stop offset="100%" stop-color="#1B283E"/>
    </linearGradient>
    <filter id="fbShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#F5F1E9"/>

  <rect x="30" y="30" width="740" height="440" rx="16" fill="url(#fbBg)" filter="url(#fbShadow)"/>

  <!-- Top Boutique Header -->
  <rect x="30" y="30" width="740" height="60" rx="16" fill="#131B2B"/>
  <circle cx="55" cy="60" r="5" fill="#EF4444"/>
  <circle cx="72" cy="60" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="60" r="5" fill="#10B981"/>

  <text x="120" y="66" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" letter-spacing="2">MAISON NOIR <tspan fill="#94A8D0" font-weight="300" font-size="12">| Haute Boutique</tspan></text>
  <text x="440" y="65" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="12">New In • Collection • Lookbook • Journal</text>
  <rect x="670" y="46" width="80" height="28" rx="14" fill="url(#fbAccent)"/>
  <text x="686" y="65" fill="#182337" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">Bag (2)</text>

  <!-- Hero Editorial Banner -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="410" height="210" rx="12" fill="url(#editorialGrad)" stroke="#2C3D5A" stroke-width="1"/>
    
    <!-- Stylized Lookbook Illustration -->
    <rect x="230" y="15" width="165" height="180" rx="10" fill="#141E2D"/>
    <!-- Silhouette / abstract fashion drape -->
    <path d="M 270 50 Q 310 30 350 50 L 370 170 Q 310 185 250 170 Z" fill="#3A4D6E" opacity="0.6"/>
    <circle cx="310" cy="55" r="18" fill="#6F86BC"/>
    <path d="M 300 80 Q 310 100 320 80 L 340 160 Q 310 170 280 160 Z" fill="#94A8D0" opacity="0.75"/>
    <text x="312" y="185" text-anchor="middle" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="10">Autumn Editorial '26</text>

    <!-- Editorial Typography -->
    <text x="25" y="40" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="11" letter-spacing="1">LIMITED CAPSULE</text>
    <text x="25" y="75" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="26">The Minimalist</text>
    <text x="25" y="105" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="26">Overcoat Edition</text>
    <text x="25" y="135" fill="#8C9DB8" font-family="'Outfit', sans-serif" font-size="12">Ethically sourced materials with</text>
    <text x="25" y="150" fill="#8C9DB8" font-family="'Outfit', sans-serif" font-size="12">tailored modern silhouettes.</text>
    <rect x="25" y="165" width="120" height="30" rx="15" fill="url(#fbAccent)"/>
    <text x="45" y="184" fill="#182337" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">Shop Lookbook</text>
  </g>

  <!-- Side Trending Grid: 2 Items -->
  <g transform="translate(480, 105)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="270" height="98" rx="10" fill="#1C273C" stroke="#2C3D5A" stroke-width="1"/>
    <rect x="10" y="10" width="78" height="78" rx="8" fill="#121A28"/>
    <circle cx="49" cy="49" r="24" fill="#324564"/>
    <text x="49" y="53" text-anchor="middle" fill="#94A8D0" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">SILK</text>
    <text x="100" y="34" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Silk Scarf Drape</text>
    <text x="100" y="52" fill="#8C9DB8" font-family="'Outfit', sans-serif" font-size="11">Monochrome Edition</text>
    <text x="100" y="78" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="15">$95.00</text>
    <rect x="195" y="60" width="65" height="26" rx="13" fill="#293952"/>
    <text x="210" y="77" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="10">+ Quick</text>

    <!-- Item 2 -->
    <rect x="0" y="112" width="270" height="98" rx="10" fill="#1C273C" stroke="#2C3D5A" stroke-width="1"/>
    <rect x="10" y="122" width="78" height="78" rx="8" fill="#121A28"/>
    <circle cx="49" cy="161" r="24" fill="#324564"/>
    <text x="49" y="165" text-anchor="middle" fill="#94A8D0" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">WOOL</text>
    <text x="100" y="146" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Structured Trench</text>
    <text x="100" y="164" fill="#8C9DB8" font-family="'Outfit', sans-serif" font-size="11">Italian Virgin Wool</text>
    <text x="100" y="190" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="15">$340.00</text>
    <rect x="195" y="172" width="65" height="26" rx="13" fill="#293952"/>
    <text x="210" y="189" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="10">+ Quick</text>
  </g>

  <!-- Bottom Details Strip -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="700" height="120" rx="12" fill="#162235" stroke="#2C3D5A" stroke-width="1"/>
    
    <g transform="translate(25, 20)">
      <circle cx="20" cy="20" r="16" fill="#24344E"/>
      <text x="15" y="25" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="14">✨</text>
      <text x="50" y="18" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">Modern UI Architecture</text>
      <text x="50" y="34" fill="#8C9DB8" font-family="'Outfit', sans-serif" font-size="10">Fluid responsive layout, mobile first</text>
    </g>

    <g transform="translate(260, 20)">
      <circle cx="20" cy="20" r="16" fill="#24344E"/>
      <text x="15" y="25" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="14">🛍️</text>
      <text x="50" y="18" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">Interactive Cart State</text>
      <text x="50" y="34" fill="#8C9DB8" font-family="'Outfit', sans-serif" font-size="10">Instant pricing recalculation and slide drawer</text>
    </g>

    <g transform="translate(500, 20)">
      <circle cx="20" cy="20" r="16" fill="#24344E"/>
      <text x="15" y="25" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="14">⚡</text>
      <text x="50" y="18" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">Zero-Latency Filtering</text>
      <text x="50" y="34" fill="#8C9DB8" font-family="'Outfit', sans-serif" font-size="10">Optimized client-side catalog search</text>
    </g>

    <rect x="25" y="75" width="650" height="30" rx="6" fill="#1C273C"/>
    <text x="40" y="94" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="11">Tech Highlights: React • TypeScript • Bootstrap 5 • Custom Transitions • Modular CSS</text>
  </g>
</svg>
