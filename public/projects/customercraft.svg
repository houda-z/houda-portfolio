<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="crmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#243B55"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2E4A"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F86BC"/>
      <stop offset="100%" stop-color="#A5B8DF"/>
    </linearGradient>
    <filter id="shadowCrm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="#F5F1E9"/>

  <!-- App Shell -->
  <rect x="30" y="30" width="740" height="440" rx="16" fill="url(#crmBg)" filter="url(#shadowCrm)"/>

  <!-- Top Navigation -->
  <rect x="30" y="30" width="740" height="60" rx="16" fill="#111A29"/>
  <circle cx="55" cy="60" r="5" fill="#EF4444"/>
  <circle cx="72" cy="60" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="60" r="5" fill="#10B981"/>

  <text x="120" y="66" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="16">Customer Craft <tspan fill="#A5B8DF" font-size="12" font-weight="400">| CRM &amp; Pipeline Platform</tspan></text>
  <rect x="440" y="46" width="180" height="28" rx="14" fill="#202F47"/>
  <text x="458" y="65" fill="#8E9EB8" font-family="'Outfit', sans-serif" font-size="12">Filter Leads &amp; Status...</text>
  <rect x="635" y="46" width="115" height="28" rx="14" fill="url(#leadGrad)"/>
  <text x="653" y="65" fill="#141E30" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">+ Add Customer</text>

  <!-- Left Sidebar -->
  <rect x="30" y="90" width="150" height="380" fill="#131E31"/>
  <rect x="42" y="115" width="125" height="32" rx="8" fill="#202F47"/>
  <text x="56" y="136" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="12">🎯 Pipeline (34)</text>
  <text x="56" y="172" fill="#8E9EB8" font-family="'Outfit', sans-serif" font-size="12">💼 Deals Active</text>
  <text x="56" y="208" fill="#8E9EB8" font-family="'Outfit', sans-serif" font-size="12">📊 Sales Metrics</text>
  <text x="56" y="244" fill="#8E9EB8" font-family="'Outfit', sans-serif" font-size="12">💬 Interactions</text>
  <text x="56" y="280" fill="#8E9EB8" font-family="'Outfit', sans-serif" font-size="12">📑 Reports</text>

  <!-- Dashboard Overview KPI Cards -->
  <g transform="translate(200, 110)">
    <rect x="0" y="0" width="170" height="85" rx="12" fill="url(#cardFill)" stroke="#2B3E5E" stroke-width="1"/>
    <text x="16" y="26" fill="#8E9EB8" font-family="'Outfit', sans-serif" font-size="11">Total Deal Volume</text>
    <text x="16" y="55" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="22">$128,450</text>
    <text x="16" y="74" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10">↑ +21.4% vs last month</text>

    <rect x="185" y="0" width="170" height="85" rx="12" fill="url(#cardFill)" stroke="#2B3E5E" stroke-width="1"/>
    <text x="201" y="26" fill="#8E9EB8" font-family="'Outfit', sans-serif" font-size="11">Active Leads</text>
    <text x="201" y="55" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="22">86 Leads</text>
    <text x="201" y="74" fill="#A5B8DF" font-family="'Outfit', sans-serif" font-size="10">34 qualified stages</text>

    <rect x="370" y="0" width="180" height="85" rx="12" fill="url(#cardFill)" stroke="#2B3E5E" stroke-width="1"/>
    <text x="386" y="26" fill="#8E9EB8" font-family="'Outfit', sans-serif" font-size="11">Conversion Rate</text>
    <text x="386" y="55" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="22">31.8%</text>
    <text x="386" y="74" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10">High velocity funnel</text>
  </g>

  <!-- Kanban Pipeline Preview -->
  <g transform="translate(200, 215)">
    <!-- Column 1: Qualified Leads -->
    <rect x="0" y="0" width="175" height="235" rx="10" fill="#18253B"/>
    <text x="14" y="24" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">Qualified (12)</text>
    <rect x="14" y="38" width="147" height="52" rx="8" fill="#202F47"/>
    <text x="24" y="58" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">TechStart Solutions</text>
    <text x="24" y="76" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10">$14,200 • High Priority</text>

    <rect x="14" y="98" width="147" height="52" rx="8" fill="#202F47"/>
    <text x="24" y="118" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">Apex Logistics</text>
    <text x="24" y="136" fill="#A5B8DF" font-family="'Outfit', sans-serif" font-size="10">$8,500 • Discovery</text>

    <rect x="14" y="158" width="147" height="52" rx="8" fill="#202F47"/>
    <text x="24" y="178" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">Nordic Retail Group</text>
    <text x="24" y="196" fill="#A5B8DF" font-family="'Outfit', sans-serif" font-size="10">$22,000 • In Review</text>

    <!-- Column 2: Negotiation -->
    <rect x="187" y="0" width="175" height="235" rx="10" fill="#18253B"/>
    <text x="201" y="24" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">Negotiation (8)</text>
    <rect x="201" y="38" width="147" height="52" rx="8" fill="#202F47"/>
    <text x="211" y="58" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">Horizon Health</text>
    <text x="211" y="76" fill="#F59E0B" font-family="'Outfit', sans-serif" font-size="10">$35,000 • Contract Sent</text>

    <rect x="201" y="98" width="147" height="52" rx="8" fill="#202F47"/>
    <text x="211" y="118" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">Studio Prime Agency</text>
    <text x="211" y="136" fill="#F59E0B" font-family="'Outfit', sans-serif" font-size="10">$12,400 • Terms Discussed</text>

    <!-- Column 3: Won & Closed -->
    <rect x="375" y="0" width="175" height="235" rx="10" fill="#18253B"/>
    <text x="389" y="24" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">Closed Won (14)</text>
    <rect x="389" y="38" width="147" height="52" rx="8" fill="#1A333A" stroke="#10B981" stroke-width="1"/>
    <text x="399" y="58" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">Global Finance Inc</text>
    <text x="399" y="76" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10">✓ $48,000 • Finalized</text>

    <rect x="389" y="98" width="147" height="52" rx="8" fill="#1A333A" stroke="#10B981" stroke-width="1"/>
    <text x="399" y="118" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">Vanguard Cloud</text>
    <text x="399" y="136" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10">✓ $19,500 • Finalized</text>
  </g>
</svg>
