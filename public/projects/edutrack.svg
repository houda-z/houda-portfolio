<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B263B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243352"/>
      <stop offset="100%" stop-color="#1B263B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F86BC"/>
      <stop offset="100%" stop-color="#94A8D0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="#F5F1E9"/>

  <!-- Main App Shell -->
  <rect x="30" y="30" width="740" height="440" rx="16" fill="url(#eduBg)" filter="url(#shadow)"/>

  <!-- Top App Navigation Bar -->
  <rect x="30" y="30" width="740" height="60" rx="16" fill="#151E2E"/>
  <!-- Window Controls -->
  <circle cx="55" cy="60" r="5" fill="#EF4444"/>
  <circle cx="72" cy="60" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="60" r="5" fill="#10B981"/>

  <!-- App Title & Search Bar -->
  <text x="120" y="66" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="16">EduTrack <tspan fill="#94A8D0" font-size="12" font-weight="400">| Academic Management</tspan></text>
  <rect x="420" y="46" width="220" height="28" rx="14" fill="#243352"/>
  <text x="440" y="65" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="12">🔍 Search courses, students...</text>
  <rect x="660" y="46" width="90" height="28" rx="14" fill="url(#accentGrad)"/>
  <text x="677" y="65" fill="#1B263B" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">+ New Course</text>

  <!-- Left Sidebar -->
  <rect x="30" y="90" width="160" height="380" fill="#182337"/>
  <!-- Nav items -->
  <rect x="45" y="115" width="130" height="32" rx="8" fill="#243352"/>
  <text x="60" y="136" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="12">📊 Dashboard</text>
  <text x="60" y="172" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="12">📚 Courses (14)</text>
  <text x="60" y="208" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="12">👥 Students (420)</text>
  <text x="60" y="244" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="12">📝 Exams & Grades</text>
  <text x="60" y="280" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="12">📈 Attendance</text>
  <text x="60" y="316" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="12">⚙️ System Config</text>

  <!-- Main Content Area -->
  <!-- 3 Metric Cards -->
  <g transform="translate(210, 110)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="165" height="85" rx="12" fill="url(#cardGrad)" stroke="#2D3F63" stroke-width="1"/>
    <text x="16" y="26" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="11">Total Enrolled</text>
    <text x="16" y="55" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="24">1,482</text>
    <text x="16" y="74" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10">↑ +14.8% this term</text>
    
    <!-- Stat 2 -->
    <rect x="180" y="0" width="165" height="85" rx="12" fill="url(#cardGrad)" stroke="#2D3F63" stroke-width="1"/>
    <text x="196" y="26" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="11">Average Attendance</text>
    <text x="196" y="55" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="24">94.6%</text>
    <text x="196" y="74" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10">↑ Top attendance rate</text>
    
    <!-- Stat 3 -->
    <rect x="360" y="0" width="180" height="85" rx="12" fill="url(#cardGrad)" stroke="#2D3F63" stroke-width="1"/>
    <text x="376" y="26" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="11">Active Modules</text>
    <text x="376" y="55" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="24">38</text>
    <text x="376" y="74" fill="#6F86BC" font-family="'Outfit', sans-serif" font-size="10">Full Stack & IT Focus</text>
  </g>

  <!-- Big Chart & Table Section -->
  <g transform="translate(210, 215)">
    <!-- Chart Box -->
    <rect x="0" y="0" width="310" height="235" rx="12" fill="url(#cardGrad)" stroke="#2D3F63" stroke-width="1"/>
    <text x="18" y="26" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Student Performance Overview</text>
    <text x="18" y="42" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="10">Monthly Average Evaluation Scores</text>
    
    <!-- Chart Grid lines -->
    <line x1="20" y1="80" x2="290" y2="80" stroke="#2D3F63" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="20" y1="120" x2="290" y2="120" stroke="#2D3F63" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="20" y1="160" x2="290" y2="160" stroke="#2D3F63" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="20" y1="200" x2="290" y2="200" stroke="#2D3F63" stroke-width="1"/>

    <!-- Chart Bars -->
    <rect x="35" y="110" width="24" height="90" rx="4" fill="#3B4D73"/>
    <rect x="80" y="85" width="24" height="115" rx="4" fill="#516A99"/>
    <rect x="125" y="65" width="24" height="135" rx="4" fill="#6F86BC"/>
    <rect x="170" y="90" width="24" height="110" rx="4" fill="#516A99"/>
    <rect x="215" y="55" width="24" height="145" rx="4" fill="url(#accentGrad)"/>
    <rect x="260" y="70" width="24" height="130" rx="4" fill="#6F86BC"/>

    <text x="38" y="216" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="9">Jan</text>
    <text x="83" y="216" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="9">Feb</text>
    <text x="128" y="216" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="9">Mar</text>
    <text x="173" y="216" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="9">Apr</text>
    <text x="218" y="216" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="9">May</text>
    <text x="263" y="216" fill="#94A8D0" font-family="'Outfit', sans-serif" font-size="9">Jun</text>

    <!-- Side Recent Activity Table -->
    <rect x="325" y="0" width="215" height="235" rx="12" fill="url(#cardGrad)" stroke="#2D3F63" stroke-width="1"/>
    <text x="340" y="26" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Recent Submissions</text>
    
    <g transform="translate(340, 48)">
      <rect x="0" y="0" width="185" height="48" rx="8" fill="#1C273C"/>
      <circle cx="20" cy="24" r="12" fill="#3B4D73"/>
      <text x="16" y="28" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">JS</text>
      <text x="40" y="20" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">Frontend Project</text>
      <text x="40" y="35" fill="#10B981" font-family="'Outfit', sans-serif" font-size="9">✓ Graded (96/100)</text>
    </g>

    <g transform="translate(340, 106)">
      <rect x="0" y="0" width="185" height="48" rx="8" fill="#1C273C"/>
      <circle cx="20" cy="24" r="12" fill="#516A99"/>
      <text x="15" y="28" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">DB</text>
      <text x="40" y="20" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">SQL Schema Exam</text>
      <text x="40" y="35" fill="#F59E0B" font-family="'Outfit', sans-serif" font-size="9">⏳ Reviewing...</text>
    </g>

    <g transform="translate(340, 164)">
      <rect x="0" y="0" width="185" height="48" rx="8" fill="#1C273C"/>
      <circle cx="20" cy="24" r="12" fill="#6F86BC"/>
      <text x="14" y="28" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">API</text>
      <text x="40" y="20" fill="#FFF" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">REST Endpoints</text>
      <text x="40" y="35" fill="#10B981" font-family="'Outfit', sans-serif" font-size="9">✓ Graded (92/100)</text>
    </g>
  </g>
</svg>
