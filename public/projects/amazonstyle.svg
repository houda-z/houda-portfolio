<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="amzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B263B"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24344E"/>
      <stop offset="100%" stop-color="#1B263B"/>
    </linearGradient>
    <linearGradient id="accentAmz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="jasminePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="amzShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#F5F1E9"/>

  <!-- Main Window -->
  <rect x="30" y="30" width="740" height="440" rx="16" fill="url(#amzBg)" filter="url(#amzShadow)"/>

  <!-- Top App Navigation -->
  <rect x="30" y="30" width="740" height="56" rx="16" fill="#131C2D"/>
  <circle cx="55" cy="58" r="5" fill="#EF4444"/>
  <circle cx="72" cy="58" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="58" r="5" fill="#10B981"/>

  <text x="120" y="63" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="16">🛒 Amazon Style <tspan fill="#FBBF24" font-size="12" font-weight="600">E-Commerce OOP</tspan></text>
  
  <rect x="370" y="44" width="220" height="28" rx="14" fill="#202E44"/>
  <text x="390" y="62" fill="#8898B3" font-family="'Outfit', sans-serif" font-size="11">Search products, tech, books...</text>
  
  <!-- Cart Badge -->
  <rect x="610" y="44" width="140" height="28" rx="14" fill="url(#accentAmz)"/>
  <text x="625" y="62" fill="#1B263B" font-family="'Outfit', sans-serif" font-weight="800" font-size="11">🛒 Cart: 4 items ($184)</text>

  <!-- Left: Product Storefront Showcase -->
  <g transform="translate(50, 105)">
    <!-- Header -->
    <text x="0" y="16" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Interactive Storefront</text>
    <text x="160" y="16" fill="#8898B3" font-family="'Outfit', sans-serif" font-size="11">OOP Cart Architecture</text>

    <!-- Product 1 -->
    <rect x="0" y="30" width="320" height="95" rx="10" fill="url(#cardBg)" stroke="#2B3D5A" stroke-width="1"/>
    <rect x="12" y="42" width="70" height="70" rx="8" fill="#162234"/>
    <circle cx="47" cy="77" r="18" fill="#2B3D5A"/>
    <text x="47" y="82" text-anchor="middle" fill="#94A8D0" font-size="14">🎧</text>
    <text x="96" y="58" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Wireless Headphones</text>
    <text x="96" y="74" fill="#FBBF24" font-family="'Outfit', sans-serif" font-size="11">★★★★★ <tspan fill="#8898B3">(128)</tspan></text>
    <text x="96" y="98" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">$79.99</text>
    <!-- Add to cart button -->
    <rect x="210" y="80" width="95" height="26" rx="13" fill="url(#accentAmz)"/>
    <text x="222" y="97" fill="#1B263B" font-family="'Outfit', sans-serif" font-weight="700" font-size="10">Add to Cart</text>

    <!-- Product 2 -->
    <rect x="0" y="135" width="320" height="95" rx="10" fill="url(#cardBg)" stroke="#2B3D5A" stroke-width="1"/>
    <rect x="12" y="147" width="70" height="70" rx="8" fill="#162234"/>
    <circle cx="47" cy="182" r="18" fill="#2B3D5A"/>
    <text x="47" y="187" text-anchor="middle" fill="#94A8D0" font-size="14">⌚</text>
    <text x="96" y="163" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Fitness Smartwatch</text>
    <text x="96" y="179" fill="#FBBF24" font-family="'Outfit', sans-serif" font-size="11">★★★★☆ <tspan fill="#8898B3">(84)</tspan></text>
    <text x="96" y="203" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">$49.50</text>
    <rect x="210" y="185" width="95" height="26" rx="13" fill="url(#accentAmz)"/>
    <text x="222" y="202" fill="#1B263B" font-family="'Outfit', sans-serif" font-weight="700" font-size="10">Add to Cart</text>

    <!-- Product 3 -->
    <rect x="0" y="240" width="320" height="95" rx="10" fill="url(#cardBg)" stroke="#2B3D5A" stroke-width="1"/>
    <rect x="12" y="252" width="70" height="70" rx="8" fill="#162234"/>
    <circle cx="47" cy="287" r="18" fill="#2B3D5A"/>
    <text x="47" y="292" text-anchor="middle" fill="#94A8D0" font-size="14">⌨️</text>
    <text x="96" y="268" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Mechanical Keyboard</text>
    <text x="96" y="284" fill="#FBBF24" font-family="'Outfit', sans-serif" font-size="11">★★★★★ <tspan fill="#8898B3">(210)</tspan></text>
    <text x="96" y="308" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">$54.99</text>
    <rect x="210" y="290" width="95" height="26" rx="13" fill="url(#accentAmz)"/>
    <text x="222" y="307" fill="#1B263B" font-family="'Outfit', sans-serif" font-weight="700" font-size="10">Add to Cart</text>
  </g>

  <!-- Right: Jasmine Test Runner Suite -->
  <g transform="translate(400, 105)">
    <rect x="0" y="0" width="340" height="345" rx="12" fill="#121C2B" stroke="#23344D" stroke-width="1"/>
    
    <!-- Jasmine Header Bar -->
    <rect x="0" y="0" width="340" height="42" rx="12" fill="#1A273D"/>
    <circle cx="22" cy="21" r="7" fill="#10B981"/>
    <text x="36" y="26" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="13">Jasmine Test Runner</text>
    <rect x="215" y="10" width="112" height="22" rx="11" fill="url(#jasminePill)"/>
    <text x="226" y="25" fill="#0D3522" font-family="'Outfit', sans-serif" font-weight="800" font-size="10">✓ 18 SPECS PASSING</text>

    <!-- Test Suite Group 1: Cart Calculation -->
    <text x="18" y="66" fill="#FBBF24" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">suite: Cart Calculation &amp; Totals</text>
    
    <g transform="translate(18, 76)">
      <rect x="0" y="0" width="304" height="32" rx="6" fill="#162234"/>
      <circle cx="16" cy="16" r="4" fill="#10B981"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="'Outfit', sans-serif" font-size="10">calculates item subtotals accurately</text>
      <text x="260" y="20" fill="#10B981" font-family="'Outfit', sans-serif" font-weight="700" font-size="9">0.002s</text>
    </g>

    <g transform="translate(18, 114)">
      <rect x="0" y="0" width="304" height="32" rx="6" fill="#162234"/>
      <circle cx="16" cy="16" r="4" fill="#10B981"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="'Outfit', sans-serif" font-size="10">applies tax rates and shipping thresholds</text>
      <text x="260" y="20" fill="#10B981" font-family="'Outfit', sans-serif" font-weight="700" font-size="9">0.001s</text>
    </g>

    <!-- Test Suite Group 2: OOP State & LocalStorage -->
    <text x="18" y="168" fill="#FBBF24" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">suite: OOP State &amp; Storage Persistence</text>

    <g transform="translate(18, 178)">
      <rect x="0" y="0" width="304" height="32" rx="6" fill="#162234"/>
      <circle cx="16" cy="16" r="4" fill="#10B981"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="'Outfit', sans-serif" font-size="10">increments quantity when duplicate added</text>
      <text x="260" y="20" fill="#10B981" font-family="'Outfit', sans-serif" font-weight="700" font-size="9">0.002s</text>
    </g>

    <g transform="translate(18, 216)">
      <rect x="0" y="0" width="304" height="32" rx="6" fill="#162234"/>
      <circle cx="16" cy="16" r="4" fill="#10B981"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="'Outfit', sans-serif" font-size="10">persists cart state across page reloads</text>
      <text x="260" y="20" fill="#10B981" font-family="'Outfit', sans-serif" font-weight="700" font-size="9">0.003s</text>
    </g>

    <g transform="translate(18, 254)">
      <rect x="0" y="0" width="304" height="32" rx="6" fill="#162234"/>
      <circle cx="16" cy="16" r="4" fill="#10B981"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="'Outfit', sans-serif" font-size="10">removes item and recalculates total</text>
      <text x="260" y="20" fill="#10B981" font-family="'Outfit', sans-serif" font-weight="700" font-size="9">0.001s</text>
    </g>

    <!-- Bottom summary status -->
    <rect x="18" y="298" width="304" height="34" rx="8" fill="#182C24" stroke="#10B981" stroke-width="1"/>
    <text x="32" y="320" fill="#34D399" font-family="'Outfit', sans-serif" font-weight="700" font-size="11">✓ All 18 tests passed without regression</text>
  </g>
</svg>
